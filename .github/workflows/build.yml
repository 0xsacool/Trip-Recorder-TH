name: Build

# Builds the APK on pushes and pull requests to main and stable. A push to main publishes a dev
# pre-release and a push to stable publishes a release, both with the signed APK. A push that only
# changes documentation files does nothing.

on:
  push:
    branches: [main, stable]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', 'docs/**']
  workflow_dispatch:
  pull_request:
    branches: [main, stable]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.build.outputs.signed }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;35.0.0" || echo "sdkmanager step skipped, using the preinstalled SDK"

      - name: Check translations
        run: python3 tools/check_translations.py

      - name: Test distance calibration
        run: |
          mkdir -p "$RUNNER_TEMP/distance-test"
          javac -d "$RUNNER_TEMP/distance-test" src/org/triprecorderng/{Trip,JourneyTracker,DistanceCalibration}.java tools/DistanceCalibrationTest.java
          java -cp "$RUNNER_TEMP/distance-test" org.triprecorderng.DistanceCalibrationTest

      - name: Test trip energy fallback
        run: |
          mkdir -p "$RUNNER_TEMP/energy-test"
          javac -d "$RUNNER_TEMP/energy-test" src/org/triprecorderng/Trip.java tools/TripEnergyFallbackTest.java
          java -cp "$RUNNER_TEMP/energy-test" org.triprecorderng.TripEnergyFallbackTest

      - name: Test remaining range estimate
        run: |
          mkdir -p "$RUNNER_TEMP/range-test"
          javac -d "$RUNNER_TEMP/range-test" src/org/triprecorderng/Trip.java src/org/triprecorderng/RangeEstimate.java tools/RangeEstimateTest.java
          java -cp "$RUNNER_TEMP/range-test" org.triprecorderng.RangeEstimateTest

      - name: Test dashboard refresh policy
        run: |
          mkdir -p "$RUNNER_TEMP/refresh-test"
          javac -d "$RUNNER_TEMP/refresh-test" src/org/triprecorderng/DashboardRefresh.java tools/DashboardRefreshTest.java
          java -cp "$RUNNER_TEMP/refresh-test" org.triprecorderng.DashboardRefreshTest

      - name: Test dashboard menu policy
        run: |
          mkdir -p "$RUNNER_TEMP/menu-test"
          javac -d "$RUNNER_TEMP/menu-test" src/org/triprecorderng/DashboardMenu.java tools/DashboardMenuTest.java
          java -cp "$RUNNER_TEMP/menu-test" org.triprecorderng.DashboardMenuTest

      - name: Test motor RPM validation
        run: |
          mkdir -p "$RUNNER_TEMP/rpm-test"
          javac -d "$RUNNER_TEMP/rpm-test" src/org/triprecorderng/MotorRpm.java tools/MotorRpmTest.java
          java -cp "$RUNNER_TEMP/rpm-test" org.triprecorderng.MotorRpmTest

      - name: Test charging detection and session recording
        run: |
          bash tools/test_charging.sh

      - name: Test EVO hybrid renderer
        run: |
          mkdir -p "$RUNNER_TEMP/evo-test"
          javac -d "$RUNNER_TEMP/evo-test" src/org/triprecorderng/EvoHybridRenderer.java tools/EvoHybridRendererTest.java
          java -cp "$RUNNER_TEMP/evo-test" org.triprecorderng.EvoHybridRendererTest

      - name: Test GT-R hybrid renderer
        run: |
          mkdir -p "$RUNNER_TEMP/gtr-test"
          javac -d "$RUNNER_TEMP/gtr-test" src/org/triprecorderng/EvoHybridRenderer.java src/org/triprecorderng/GtrHybridRenderer.java tools/GtrHybridRendererTest.java
          java -cp "$RUNNER_TEMP/gtr-test" org.triprecorderng.GtrHybridRendererTest

      - name: Test Type-R hybrid renderer
        run: |
          mkdir -p "$RUNNER_TEMP/typer-test"
          javac -d "$RUNNER_TEMP/typer-test" src/org/triprecorderng/EvoHybridRenderer.java src/org/triprecorderng/TypeRHybridRenderer.java tools/TypeRHybridRendererTest.java
          java -cp "$RUNNER_TEMP/typer-test" org.triprecorderng.TypeRHybridRendererTest

      - name: Test remaining hybrid renderers
        run: |
          mkdir -p "$RUNNER_TEMP/additional-test"
          javac -d "$RUNNER_TEMP/additional-test" src/org/triprecorderng/EvoHybridRenderer.java src/org/triprecorderng/AdditionalHybridRenderer.java tools/AdditionalHybridRendererTest.java
          java -cp "$RUNNER_TEMP/additional-test" org.triprecorderng.AdditionalHybridRendererTest

      - name: Test custom gauges across all eight performance themes
        run: |
          mkdir -p "$RUNNER_TEMP/gauge-test"
          javac -d "$RUNNER_TEMP/gauge-test" src/org/triprecorderng/EvoHybridRenderer.java src/org/triprecorderng/GtrHybridRenderer.java src/org/triprecorderng/TypeRHybridRenderer.java src/org/triprecorderng/AdditionalHybridRenderer.java tools/CustomGaugeTest.java
          java -cp "$RUNNER_TEMP/gauge-test" org.triprecorderng.CustomGaugeTest

      - name: Test appearance policy
        run: |
          mkdir -p "$RUNNER_TEMP/appearance-test"
          javac -d "$RUNNER_TEMP/appearance-test" src/org/triprecorderng/Appearance.java tools/AppearanceTest.java
          java -cp "$RUNNER_TEMP/appearance-test" org.triprecorderng.AppearanceTest

      - name: Test eight performance cockpit day and night palettes
        run: |
          mkdir -p "$RUNNER_TEMP/cockpit-palette-test"
          javac -d "$RUNNER_TEMP/cockpit-palette-test" src/org/triprecorderng/CockpitPalette.java tools/CockpitPaletteTest.java
          java -cp "$RUNNER_TEMP/cockpit-palette-test" org.triprecorderng.CockpitPaletteTest

      - name: Test updater signer verification
        run: |
          mkdir -p "$RUNNER_TEMP/signer-test"
          javac -d "$RUNNER_TEMP/signer-test" src/org/triprecorderng/ApkSigners.java tools/ApkSignersTest.java
          java -cp "$RUNNER_TEMP/signer-test" org.triprecorderng.ApkSignersTest

      - name: Build
        id: build
        env:
          EVENT: ${{ github.event_name }}
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ "$EVENT" != "pull_request" ] && [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            export KEYSTORE="$RUNNER_TEMP/signing.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            unset KS_PASS
            echo "::warning::No signing key available: building with a throwaway key (this APK cannot update an app signed with your own key)"
          fi
          # the build's name: dev-N from main, stable-N from stable, anything else is not a release build
          case "$EVENT:$GITHUB_REF_NAME" in
            push:stable|workflow_dispatch:stable) CHANNEL=stable ;;
            push:main|workflow_dispatch:main) CHANNEL=dev ;;
            *) CHANNEL="build-${GITHUB_REF_NAME//\//-}" ;;
          esac
          if [ "$CHANNEL" = dev ]; then
            git fetch --tags origin
            LAST_DEV=$(git tag --list 'dev-*' | sed -n 's/^dev-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
            export VERSION_NAME="dev-$(( ${LAST_DEV:-0} + 1 ))"
          else
            export VERSION_NAME="${CHANNEL}-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          ./build.sh
          java -cp "$RUNNER_TEMP/signer-test" org.triprecorderng.ApkSignersTest TripRecorderNG.apk
          # the update check identifies a build by this name, so a wrong one must fail the build
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging TripRecorderNG.apk | grep -q "versionName='$VERSION_NAME'" \
            || { echo "::error::the APK's version name is not $VERSION_NAME"; exit 1; }
          mkdir -p dist
          "$BT/aapt2" dump badging TripRecorderNG.apk | grep -q "package: name='com.evtriplog.app'" \
            || { echo "::error::wrong Android package"; exit 1; }
          "$BT/aapt2" dump badging TripRecorderNG.apk | grep -q "launchable-activity: name='org.triprecorderng.MainActivity'" \
            || { echo "::error::wrong launcher activity"; exit 1; }
          cp TripRecorderNG.apk "dist/EVTripLog-app-${VERSION_NAME}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: EVTripLog-${{ github.run_number }}
          path: dist/*.apk
          retention-days: ${{ github.ref == 'refs/heads/stable' && 90 || 14 }}

  release:
    # only for pushes to main and stable, and only for APKs signed with the real key
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.outputs.signed == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: EVTripLog-${{ github.run_number }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$VERSION" in
            stable-*) KIND=(--latest); SINCE=(--match 'stable-*') ;;
            *) KIND=(--prerelease); SINCE=(--match 'dev-*' --match 'stable-*') ;;
          esac
          # the notes list the commits since the previous build (a stable release: since the previous stable one)
          PREV=$(git describe --tags --abbrev=0 "${SINCE[@]}" HEAD 2>/dev/null || true)
          {
            echo "## What changed"
            echo
            for c in $(git rev-list --no-merges --reverse ${PREV:+$PREV..}HEAD); do
              subject=$(git log -1 --format=%s "$c")
              case "$subject" in CI:*) continue ;; esac
              echo "### $subject"
              git log -1 --format=%b "$c"
            done
            echo
            echo "---"
            echo "After installing, turn EV TripLog OFF in the car's Disable background Apps list and restart the head unit once (BYD resets that switch on every install). Unofficial, use at your own risk: see the README."
          } > notes.md
          gh release create "$VERSION" dist/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "EV TripLog v1.0.0 (${VERSION})" "${KIND[@]}" --generate-notes \
            --notes-file notes.md


